name: Bug Report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug
      placeholder: Describe the issue briefly
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Go to...
        2. Click...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Logs, suspected cause, related issues

  - type: textarea
    id: blockers
    attributes:
      label: Blockers
      description: Related dependencies or issues blocking progress