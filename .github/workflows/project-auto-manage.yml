name: Project Column Manager

on:
  issues:
    types: [assigned, unassigned]

jobs:
  manage-columns:
    runs-on: ubuntu-latest
    steps:
      - name: Move Issue in Project
        shell: bash
        env:
          GH_TOKEN: '${{ secrets.PROJECT_AUTOMATION_TOKEN }}'
          OWNER: "barefishe" 
          PROJECT_NUMBER: 1
          ISSUE_NODE_ID: '${{ github.event.issue.node_id }}'
          EVENT_ACTION: '${{ github.event.action }}'
          ASSIGNEES_JSON: '${{ toJson(github.event.issue.assignees) }}'
        run: |
          ProjectId=$(gh api graphql -f query='
            query($owner: String!, $number: Int!) {
              repositoryOwner(login: $owner) {
                ... on User {
                  projectV2(number: $number) { id }
                }
                ... on Organization {
                  projectV2(number: $number) { id }
                }
              }
            }' -f owner="$OWNER" -F number="$PROJECT_NUMBER" --jq '.data.repositoryOwner.projectV2.id')
          
          StatusJson=$(gh api graphql -f query='
            query($project: ID!) {
              node(id: $project) {
                ... on ProjectV2 {
                  fields(first: 20) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id
                        name
                        options { id name }
                      }
                    }
                  }
                }
              }
            }' -f project="$ProjectId" --jq '.data.node.fields.nodes[] | select(.name=="Status")')

          FieldId=$(echo "$StatusJson" | jq -r '.id')
          InProgressId=$(echo "$StatusJson" | jq -r '.options[] | select(.name=="In progress") | .id')
          ReadyId=$(echo "$StatusJson" | jq -r '.options[] | select(.name=="Ready") | .id')
          
          ItemId=$(gh api graphql -f query='
            query($issueId: ID!) {
              node(id: $issueId) {
                ... on Issue {
                  projectItems(first: 10) {
                    nodes {
                      id
                      project { id }
                    }
                  }
                }
              }
            }' -f issueId="$ISSUE_NODE_ID" --jq ".data.node.projectItems.nodes[] | select(.project.id == \"$ProjectId\") | .id")

          AssigneeCount=$(echo "$ASSIGNEES_JSON" | jq 'length')
          TargetOption=""

          if [[ "$EVENT_ACTION" == "assigned" ]]; then
            TargetOption="$InProgressId"
            
          elif [[ "$EVENT_ACTION" == "unassigned" ]]; then
            if [[ "$AssigneeCount" -eq 0 ]]; then
              TargetOption="$ReadyId"
            else
              exit 0
            fi
          fi

          if [[ -n "$TargetOption" ]]; then
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: { 
                  projectId: $project, 
                  itemId: $item, 
                  fieldId: $field, 
                  value: { singleSelectOptionId: $value } 
                }) {
                  projectV2Item { id }
                }
              }' -f project="$ProjectId" -f item="$ItemId" -f field="$FieldId" -f value="$TargetOption"
          else
            echo "No matching logic found. Exiting."
          fi
